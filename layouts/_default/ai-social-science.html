{{ define "main" }}
<div class="resource-page">
    <div class="rp-header">
        <div class="container">
            <h1>{{ .Title }}</h1>
            {{ with .Params.subtitle }}<p class="rp-subtitle">{{ . }}</p>{{ end }}
        </div>
    </div>

    <nav aria-label="Breadcrumb" class="rp-breadcrumb"><!-- M-06 -->
        <div class="container">
            <ol style="list-style:none;display:flex;gap:6px;align-items:center;padding:0;margin:0;">
                <li><a href="{{ .Site.Home.RelPermalink }}">Home</a></li>
                <li aria-hidden="true" style="color:#999;">&rsaquo;</li>
                <li><span aria-current="page">{{ .Title }}</span></li>
            </ol>
        </div>
    </nav>

    <div class="rp-content">
        <div class="container">
            {{ .Content }}
        </div>
    </div>
</div>

<style>
.resource-page { margin: 0; padding: 0; }

.rp-header {
    background: linear-gradient(135deg, #1a3a5c 0%, #0d2137 100%);
    color: white;
    padding: 60px 0;
}

.rp-header h1 { font-size: 42px; font-weight: 300; margin: 0; }
.rp-subtitle { font-size: 18px; margin-top: 15px; opacity: 0.9; max-width: 750px; line-height: 1.6; }

.rp-breadcrumb {
    background: #f8f9fa;
    padding: 15px 0;
    border-bottom: 1px solid #e5e5e5;
    font-size: 14px;
}
.rp-breadcrumb a { color: #1a3a5c; text-decoration: none; }
.rp-breadcrumb a:hover { text-decoration: underline; }
.rp-breadcrumb span { color: #666; }

.rp-content { padding: 60px 0; }
.rp-content .container { max-width: 1000px; }

.rp-content h2 {
    font-size: 28px; font-weight: 400; color: #1a3a5c;
    margin: 50px 0 20px 0; padding-bottom: 10px;
    border-bottom: 2px solid #e8eef4;
}
.rp-content h2:first-child { margin-top: 0; }
.rp-content h3 { font-size: 20px; font-weight: 600; color: #333; margin: 25px 0 10px 0; }
.rp-content p { font-size: 16px; line-height: 1.7; color: #444; margin-bottom: 15px; }
.rp-content ul, .rp-content ol { margin: 15px 0; padding-left: 25px; }
.rp-content li { font-size: 16px; line-height: 1.7; color: #444; margin-bottom: 8px; }
.rp-content a { color: #1a3a5c; text-decoration: none; }
.rp-content a:hover { text-decoration: underline; }

.rp-content pre {
    background: #1e2d3d; color: #e8f0f8; padding: 20px 25px;
    border-radius: 8px; overflow-x: auto; font-size: 14px;
    line-height: 1.6; margin: 20px 0;
}
.rp-content code {
    font-family: 'Courier New', Courier, monospace;
    font-size: 14px;
}
.rp-content p code, .rp-content li code {
    background: #eef2f7; color: #1a3a5c; padding: 2px 6px;
    border-radius: 3px; font-size: 13px;
}

.rp-content .info-box {
    background: #eef4fb; border-left: 4px solid #1a3a5c;
    padding: 20px 25px; margin: 25px 0; border-radius: 0 8px 8px 0;
}
.rp-content .info-box p { margin: 0; }

.rp-content .card-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px; margin: 25px 0;
}
.rp-content .card {
    background: #fff; border: 1px solid #dce6f0; border-radius: 8px;
    padding: 22px; text-align: left;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}
.rp-content .card:hover { transform: translateY(-3px); box-shadow: 0 6px 18px rgba(0,0,0,0.1); }
.rp-content .card h3 { margin: 0 0 10px 0; font-size: 17px; color: #1a3a5c; }
.rp-content .card p { font-size: 14px; color: #555; margin: 0; }

.rp-content hr { border: none; border-top: 1px solid #e5e5e5; margin: 50px 0; }

@media (max-width: 768px) {
    .rp-header h1 { font-size: 30px; }
    .rp-content { padding: 35px 0; }
    .rp-content .card-grid { grid-template-columns: 1fr; }
}
</style>
{{ end }}
